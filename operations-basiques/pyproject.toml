# Fichier de configuration du package (format standard moderne)

[build-system]
# Outil utilisé pour construire le package
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Nom du projet
name = "operations-basiques"

# Version du package
version = "0.1.0"

# Description courte
description = "Un petit package d'exemple avec des opérations mathématiques basiques."

# Utiliser le README comme description longue (optionnel)
readme = "README.md"

# Version minimale de Python
requires-python = ">=3.11"

# Auteur (facultatif)
authors = [
  { name = "Votre Nom", email = "vous@example.com" }
]

# Licence (texte libre pour rester simple)
license = { text = "MIT" }

# Dépendances du projet
# Ici il n'y en a aucune, mais voici quelques exemples commentés :
dependencies = [
  # Exemple : une dépendance avec version minimale
  # "numpy>=1.26",

  # Exemple : dépendance avec intervalle de versions
  # "pandas>=2.0,<3.0",

  # Exemple : dépendance simple (aucune contrainte de version)
  # "pandas",

  # Exemple : dépendance avec version précise
  # "pandas==2.0",
]

[project.urls]
"Homepage" = "https://example.com/operations-basiques"
"Source"   = "https://example.com/operations-basiques/source"

[project.scripts]
# Cette section permet de déclarer des "scripts" (commandes) en ligne de commande.
# - La clé à gauche est le nom de la commande qui sera disponible dans le terminal
#   après installation du package (ex : `operations-multiplier`).
# - La valeur à droite a la forme "module_python:fonction"
#   et indique quel point d'entrée Python appeler quand on lance la commande.
# En général :
#   ma-commande = "mon_package.mon_module:main"

operations-multiplier = "operations_basiques.cli.multiplier_cli:main"
operations-diviser    = "operations_basiques.cli.diviser_cli:main"